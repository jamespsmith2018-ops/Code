# Builds the site and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so the UK meteor data stays current.
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

      # Pull the full NASA dataset; if the source is unavailable the
      # committed sample data is published instead.
      - name: Fetch latest meteorite data
        run: npm run fetch-data
        continue-on-error: true
        env:
          METEORITE_DATA_URL: ${{ vars.METEORITE_DATA_URL }}

      # Top up UK Meteor Network data from the newest committed day to today.
      - name: Refresh UK meteor data
        run: npm run ukmon -- --resume
        continue-on-error: true

      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
